plugins {
	id 'buildlogic.java-common-conventions'
    id 'org.gradlex.extra-java-module-info'
}

extraJavaModuleInfo {

	// commons-collections 3.2.2 is still required by commons-beanutils 1.11.0
    automaticModule("commons-collections:commons-collections", "commons.collections")


	////// for testing
    
    automaticModule("net.jodah:concurrentunit", "net.jodah.concurrentunit")
	    //TestNG's dependencies
    automaticModule("org.jcommander:jcommander", "jcommander")
    automaticModule("org.webjars:jquery", "org.webjars.jquery")
    
    // chart-fx transitive dependencies without module descriptors.
    automaticModule("ar.com.hjg:pngj", "ar.com.hjg.pngj")
    automaticModule("org.hdrhistogram:HdrHistogram", "org.hdrhistogram.HdrHistogram")
    automaticModule("com.github.wendykierp:JTransforms", "com.github.wendykierp.JTransforms")
    automaticModule("pl.edu.icm:JLargeArrays", "pl.edu.icm.JLargeArrays")
    automaticModule("org.apache.commons:commons-math3", "org.apache.commons.math3")

}
