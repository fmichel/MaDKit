plugins {
    id 'buildlogic.madkit-common-conventions'
    id 'application'
}

extraJavaModuleInfo {
    module('org.jetbrains.kotlin:kotlin-stdlib', 'kotlin.stdlib') { patchRealModule() }
    module('org.jetbrains.kotlin:kotlin-stdlib-jdk7', 'kotlin.stdlib.jdk7') { patchRealModule() }
    module('org.jetbrains.kotlin:kotlin-stdlib-jdk8', 'kotlin.stdlib.jdk8') { patchRealModule() }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-common'
}

def lwjglVersion = '3.3.6'
def jomlVersion = '1.10.8'
def lwjglNatives = providers.gradleProperty('lwjglNatives').orElse('natives-linux')

group = 'io.github.fmichel'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':MaDKit')
    implementation "org.lwjgl:lwjgl:$lwjglVersion"
    implementation "org.lwjgl:lwjgl-glfw:$lwjglVersion"
    implementation "org.lwjgl:lwjgl-opengl:$lwjglVersion"
    runtimeOnly "org.lwjgl:lwjgl:$lwjglVersion:${lwjglNatives.get()}"
    runtimeOnly "org.lwjgl:lwjgl-glfw:$lwjglVersion:${lwjglNatives.get()}"
    runtimeOnly "org.lwjgl:lwjgl-opengl:$lwjglVersion:${lwjglNatives.get()}"
    implementation "org.joml:joml:$jomlVersion"

    testImplementation libs.testng
    testImplementation libs.assertJ
}

application {
    mainModule = 'madkit.gl3d'
    mainClass = 'madkit.gl3d.demo.GLTriangleDemo'
}

tasks.withType(JavaExec).configureEach {
    jvmArgs '--add-modules', 'ALL-MODULE-PATH'
}

tasks.named('test') {
    useTestNG()
}