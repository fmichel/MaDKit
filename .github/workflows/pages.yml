name: Deploy documentation site

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'scripts/assemble-pages-site.sh'
      - 'MaDKit/src/**'
      - 'MaDKit/build.gradle'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Assemble authored pages and Javadoc
        run: bash scripts/assemble-pages-site.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: build/pages-source
          destination: build/pages-site

      - name: Verify generated site
        run: |
          test -f build/pages-site/index.html
          test -f build/pages-site/api/latest/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
