plugins {
	id 'buildlogic.madkit-common-conventions'
	id 'org.gradlex.java-module-testing'
}

javafx {
	modules = ['javafx.base', 'javafx.controls', 'javafx.graphics', 'javafx.web']
}

application {
	mainClass = 'madkit.samples.SamplesLauncher'
	mainModule = 'madkit.samples'
}

tasks.withType(JavaExec) {
	jvmArgs '--add-modules', 'ALL-MODULE-PATH'
}

// The MaDKit test-fixtures JAR has no module-info (it is patched into madkit.base).
// Prevent extraJavaModuleInfo from failing on it.
extraJavaModuleInfo {
	failOnMissingModuleInfo = false
}

javaModuleTesting.whitebox(testing.suites.getByName("test")) {
	requires.add("org.testng")
	opensTo.add("org.testng")
	requires.add("org.assertj.core")
	requires.add("net.jodah.concurrentunit")
}

dependencies {
	api project(':MaDKit')
	implementation libs.commonmark

	testImplementation testFixtures(project(':MaDKit'))
	testImplementation libs.testng
	testImplementation libs.assertJ
	testImplementation libs.concurrentunit
}

// testFixtures classes live in madkit.kernel, a package owned by madkit.base.
// The whitebox plugin patches only the sample test sources into madkit.samples;
// patch the fixture output into madkit.base as well so fixture imports resolve
// without weakening the production module boundary or creating a split module.
afterEvaluate {
	tasks.named('compileTestJava').configure {
		def testFixturesDir = project(':MaDKit').layout.buildDirectory.dir("classes/java/testFixtures").get().asFile.path
		doFirst {
			options.compilerArgs.addAll(['--patch-module', "madkit.base=${testFixturesDir}"])
		}
	}
	tasks.named('test').configure {
		def testFixturesDir = project(':MaDKit').layout.buildDirectory.dir("classes/java/testFixtures").get().asFile.path
		doFirst {
			jvmArgs '--patch-module', "madkit.base=${testFixturesDir}",
					'--add-reads', 'madkit.base=org.assertj.core',
					'--add-reads', 'madkit.base=org.testng',
					'--add-reads', 'madkit.base=net.jodah.concurrentunit'
			classpath = classpath.filter { !it.name.contains('test-fixtures') }
		}
	}
}

tasks.named('test') {
	useTestNG()
}