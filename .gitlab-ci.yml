variables:
  VERSION: "6.0.5"

stages:
  - build
  - test
  - check
  - deploy

.gradle_script: &gradle_script
  - GRADLE_USER_HOME="$(pwd)/.gradle"
  - export GRADLE_USER_HOME
  - mkdir -p $GRADLE_USER_HOME

default:
  tags:
    - balrogrunner8
  image: eclipse-temurin:25-alpine
  before_script:
    - *gradle_script
  cache: &global_cache
    key: MaDKit-$CI_PROJECT_ID
    paths:
      - MaDKit/build
      - gradle/wrapper/
      - .gradle

build:
  stage: build
  script: ./gradlew --build-cache assemble

test:
  stage: test
  script: ./gradlew --build-cache check
  artifacts:
    when: on_failure
    paths:
      - MDK-simu-integration-tests/build/reports/tests/test/*

sonarqube-check:
  stage: check
  cache:
    <<: *global_cache
    policy: pull
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  script: ./gradlew sonar
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
        
deploy-javadoc:
  stage: deploy
  image: finalgene/openssh
  cache:
    <<: *global_cache
    policy: pull
  script:
    - apk add --no-cache lftp #install the lftp package
    - lftp -u $WEB_USER,$WEB_PASS -e "set ftp:ssl-allow 0; mkdir -p web/javadoc/$VERSION; mirror -R MaDKit/build/docs/javadoc web/javadoc/$VERSION; bye;" sftp://cwbq.ftp.infomaniak.com  
  environment: production
  rules:
    - if: $CI_COMMIT_TAG

.deploy_gpg_job: &deploy_gpg_job
  stage: deploy
  cache:
    <<: *global_cache
    policy: pull
  before_script:
    - apk add --no-cache gnupg
    - *gradle_script
    - cat "$GPG_SECRET_KEY" | base64 --decode | gpg --pinentry-mode loopback --passphrase $GPG_signing --import
    - echo "test" | gpg --clearsign --batch --pinentry-mode loopback --passphrase $GPG_signing
  environment: production

deploy-production:
  extends: .deploy_gpg_job
  variables:
    SIGNING_KEY_ID: "$SIGNING_KEY_ID"
    SIGNING_KEY_PASSWORD: "$SIGNING_KEY_PASSWORD"
    SIGNING_KEY_BASE64: "$SIGNING_KEY_BASE64"
  script: 
     - ./gradlew -Pversion="$CI_COMMIT_TAG" -PmavenCentralPassword="$mavenCentralPassword" -PmavenCentralUsername="$mavenCentralUsername" MaDKit:publishToMavenCentral
  rules:
    - if: $CI_COMMIT_TAG

deploy-staging:
  extends: .deploy_gpg_job
  script: 
     - ./gradlew -Pversion="$VERSION-SNAPSHOT" -PmavenCentralPassword="$mavenCentralPassword" -PmavenCentralUsername="$mavenCentralUsername" MaDKit:publishToMavenCentral
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'

check-signing-key:
  stage: verify
  script:
    - test -n "$SIGNING_KEY_BASE64"
    - echo "$SIGNING_KEY_BASE64" | base64 -d > signing-subkey.asc
    - test "$(head -n 1 signing-subkey.asc)" = "-----BEGIN PGP PRIVATE KEY BLOCK-----"
    - test "$(tail -n 1 signing-subkey.asc)" = "-----END PGP PRIVATE KEY BLOCK-----"
    - echo "Signing key format is valid"
